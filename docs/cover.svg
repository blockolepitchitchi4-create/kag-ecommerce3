<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="628" viewBox="0 0 1200 628">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="f" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="30" flood-color="#0b1220" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0f172a" />
  <rect x="60" y="60" width="1080" height="508" rx="20" fill="url(#g)" filter="url(#f)" />

  <!-- Left panel text -->
  <g transform="translate(120,160)">
    <text x="0" y="0" font-family="Inter, Arial, Helvetica, sans-serif" font-weight="700" font-size="56" fill="#ffffff">KAG E‑commerce</text>
    <text x="0" y="70" font-family="Inter, Arial, Helvetica, sans-serif" font-weight="600" font-size="28" fill="#e6f7fb">Template TypeScript</text>

    <rect x="0" y="94" rx="8" ry="8" width="420" height="56" fill="#ffffff" opacity="0.08" />
    <text x="18" y="132" font-family="Inter, Arial, Helvetica, sans-serif" font-weight="600" font-size="18" fill="#ffffff">Déployable en 5 minutes — React + Cloudflare Workflows</text>

    <!-- Price badge -->
    <g transform="translate(0,170)">
      <rect x="0" y="0" rx="10" ry="10" width="136" height="56" fill="#fff" opacity="0.95" />
      <text x="20" y="36" font-family="Inter, Arial, Helvetica, sans-serif" font-weight="700" font-size="26" fill="#0f172a">10 €</text>
    </g>
  </g>

  <!-- Right decorative mockups -->
  <g transform="translate(720,160)">
    <rect x="0" y="0" width="340" height="220" rx="12" fill="#ffffff" opacity="0.12" />
    <rect x="20" y="20" width="300" height="40" rx="6" fill="#ffffff" opacity="0.18" />
    <rect x="20" y="76" width="260" height="14" rx="6" fill="#ffffff" opacity="0.12" />
    <rect x="20" y="100" width="180" height="14" rx="6" fill="#ffffff" opacity="0.12" />
    <rect x="20" y="132" width="220" height="14" rx="6" fill="#ffffff" opacity="0.12" />
  </g>

  <!-- Footer small text -->
  <text x="120" y="560" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" fill="#94a3b8">Template TypeScript — déployable sur Vercel, Netlify ou Cloudflare Workers</text>

</svg>
